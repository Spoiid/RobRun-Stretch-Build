name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out RobRun-Stretch source
        uses: actions/checkout@v4
        with:
          repository: tur0z/RobRun-Stretch
          ref: main
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        working-directory: source
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        working-directory: source
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name RobRunResolutionTool
          --add-data "assets;assets"
          --icon "assets\\icon.ico"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.Qt3DCore
          main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RobRunResolutionTool-Windows
          path: source/dist/RobRunResolutionTool.exe
          if-no-files-found: error
          retention-days: 7
